<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#D91424">
    <link rel="icon" type="image/webp" href="img/corazon.webp">
    <title>Perú Vive</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        peru: {
                            red: '#C8102E',
                            darkRed: '#A80F1D',
                            lightRed: '#FEE2E2',
                            dark: '#1F2937',
                            gray: '#F3F4F6'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Estilos propios de Perú Vive -->
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        body {
            font-family: 'Atkinson Hyperlegible', 'Inter', Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* Ocultar barra de desplazamiento manteniendo funcionalidad */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen">

    <!-- Contenedor principal con formato App Móvil Nativo -->
    <div id="app-container" class="w-full max-w-md bg-white h-screen h-[100dvh] sm:h-[844px] sm:h-[min(844px,calc(100dvh-2rem))] sm:rounded-3xl sm:shadow-2xl flex flex-col relative overflow-hidden border border-slate-200">

        <!-- Header superior (se oculta en las pantallas de acceso; ver app.actualizarMarco) -->
        <header id="main-header" class="bg-peru-darkRed text-white px-4 py-3 flex items-center justify-between shadow-md z-20 hidden">
            <button onclick="app.navegar('inicio')" class="flex items-center space-x-3 text-left" aria-label="Ir al inicio">
                <div class="bg-white p-2 rounded-xl shadow-inner flex-shrink-0">
                    <img src="img/corazon.webp" alt="" class="w-7 h-7 object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Perú Vive</h1>
                    <p id="header-subtitulo" class="text-sm text-white font-medium">Mi cuadra, mi gente, mi alerta</p>
                </div>
            </button>
            <div class="flex items-center space-x-2">
                <button onclick="app.navegar('notificaciones')" aria-label="Notificaciones" class="relative w-12 h-12 flex items-center justify-center text-white border-[3px] border-white rounded-full transition">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span id="punto-notif" class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-yellow-400 rounded-full border-2 border-peru-darkRed hidden"></span>
                </button>
                <button id="header-avatar" onclick="app.navegar('perfil')" aria-label="Mi perfil" class="w-10 h-10 rounded-full bg-white/20 border-2 border-white/80 flex items-center justify-center font-bold text-sm shadow overflow-hidden">
                    S
                </button>
            </div>
        </header>

        <!-- Contenedor de Vistas (Router Outlet) -->
        <main id="router-view" class="flex-1 overflow-y-auto no-scrollbar pb-28 relative">
            <!-- El contenido de las vistas se inyectará aquí dinámicamente -->
        </main>

        <!-- Barra de Navegación Inferior (se oculta en las pantallas de acceso) -->
        <nav id="bottom-nav" aria-label="Principal" class="absolute bottom-0 left-0 right-0 bg-white border-t-[3px] border-[#1A1A1A] px-1.5 pt-2 pb-3 flex justify-around items-end z-30 hidden">
            <button onclick="app.navegar('inicio')" data-route="inicio" class="nav-btn flex flex-col items-center text-[#1A1A1A] min-w-[64px] min-h-[56px] justify-center transition">
                <i class="fa-solid fa-house text-2xl mb-0.5"></i>
                <span class="text-[14px] font-bold">Inicio</span>
            </button>
            <button onclick="app.navegar('mapa')" data-route="mapa" class="nav-btn flex flex-col items-center text-[#1A1A1A] min-w-[64px] min-h-[56px] justify-center transition">
                <i class="fa-solid fa-map-location-dot text-2xl mb-0.5"></i>
                <span class="text-[14px] font-bold">Mapa</span>
            </button>
            <button onclick="app.navegar('asistente')" data-route="asistente" class="flex flex-col items-center -mt-9 group" aria-label="Asistente virtual">
                <div class="w-[72px] h-[72px] bg-peru-red text-white rounded-full flex items-center justify-center border-4 border-[#1A1A1A] group-hover:scale-105 transition transform">
                    <i class="fa-solid fa-robot text-3xl"></i>
                </div>
            </button>
            <button onclick="app.navegar('comunidad')" data-route="comunidad" class="nav-btn flex flex-col items-center text-[#1A1A1A] min-w-[64px] min-h-[56px] justify-center transition">
                <i class="fa-solid fa-people-group text-2xl mb-0.5"></i>
                <span class="text-[14px] font-bold">Comunidad</span>
            </button>
            <button onclick="app.navegar('perfil')" data-route="perfil" class="nav-btn flex flex-col items-center text-[#1A1A1A] min-w-[64px] min-h-[56px] justify-center transition">
                <i class="fa-solid fa-user text-2xl mb-0.5"></i>
                <span class="text-[14px] font-bold">Perfil</span>
            </button>
        </nav>

    </div>

    <!-- Scripts de la Aplicación -->
    <!-- Leaflet.js JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nube.js"></script>
    <!-- 1. Inicio y acceso -->
    <script src="js/ubigeo.js"></script>
    <script src="js/components/acceso.js"></script>
    <script src="js/components/perfil-inicial.js"></script>
    <!-- 2. Panel del ciudadano -->
    <script src="js/components/inicio.js"></script>
    <script src="js/components/mapa-solidario.js"></script>
    <script src="js/components/reportar-emergencia.js"></script>
    <script src="js/components/solicitar-ayuda.js"></script>
    <script src="js/components/ofrecer-ayuda.js"></script>
    <!-- 3. Comunidad y seguimiento -->
    <script src="js/components/solicitudes.js"></script>
    <script src="js/components/comunidad.js"></script>
    <script src="js/components/notificaciones.js"></script>
    <script src="js/components/mis-ayudas.js"></script>
    <script src="js/components/centro-ayuda.js"></script>
    <!-- 4. Centro de coordinación -->
    <script src="js/components/coordinacion.js"></script>
    <!-- 5. Perfil y configuración -->
    <script src="js/components/cuenta.js"></script>
    <!-- 6. Guía de primer uso -->
    <script src="js/components/guia.js"></script>
<script src="js/components/recompensas.js"></script>
<script src="js/components/asistente.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
