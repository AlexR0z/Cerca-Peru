<!doctype html><html lang="es-PE"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#D91023">
<title>Perú Vive · MVP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--red:#D91023;--red2:#a30b1a;--gold:#F6B90E;--teal:#12A4A0;--pink:#E0267A;--pur:#7b3fe4;--bg:#FFF8EE;--card:#fff;--ink:#1c1210;--mute:#6b5a52}
@media(prefers-color-scheme:dark){:root{--bg:#17100e;--card:#251a17;--ink:#fff3e6;--mute:#c4aea3}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.45}
#app{max-width:30rem;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg)}
.white{background:#fff;color:#060624;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
.pad{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 120px}
h1{font-size:1.9rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}h2{font-size:1.15rem;font-weight:800}
.mute{color:var(--mute)}.c{text-align:center}.gap>*+*{margin-top:14px}
.btn{display:flex;width:100%;min-height:54px;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;font-weight:800;font-size:1.05rem;cursor:pointer;text-decoration:none;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--red2);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--red2)}
.btn.gold{background:var(--gold);color:#1c1210;box-shadow:0 6px 0 #b98a00}.btn.teal{background:var(--teal);color:#10201f;box-shadow:0 6px 0 #0b7a77}.btn.ghost{background:none;color:inherit;border:3px solid currentColor;box-shadow:none}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:16px;box-shadow:5px 5px 0 var(--a,var(--red))}
.field{display:grid;gap:5px;font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{min-height:50px;border:3px solid #060624;border-radius:26px;padding:10px 18px;background:#fff;color:#060624}
.field textarea{border-radius:20px;min-height:110px}
.err{color:var(--red);font-weight:700;font-size:.85rem}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{width:44px;height:44px;border-radius:50%;border:3px solid currentColor;background:none;font-size:1.2rem;cursor:pointer}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:30rem;background:var(--card);border-top:3px solid var(--ink);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;font-size:.72rem;font-weight:800;color:var(--ink);text-decoration:none}
nav a b{font-size:1.4rem;line-height:1}nav a.on{color:var(--red)}
nav a.sos b{width:56px;height:56px;border-radius:50%;background:var(--red);border:3px solid var(--ink);display:grid;place-items:center;margin-top:-26px;font-size:1.5rem;box-shadow:0 4px 0 var(--red2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.act{display:flex;flex-direction:column;justify-content:space-between;min-height:132px;padding:14px;border:3px solid var(--ink);border-radius:24px;text-decoration:none;color:#fff;font-weight:800;font-size:1.05rem}
.act span{font-size:1.8rem}.act small{font-weight:500;opacity:.92;display:block}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border:3px solid var(--ink);border-radius:20px;background:var(--card);font-weight:700;cursor:pointer;margin-top:10px}
.opt.on{background:var(--gold);color:#1c1210}.opt span{font-size:1.5rem}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.75rem;font-weight:800;color:#fff;background:var(--red)}
.b1{background:var(--gold);color:#1c1210}.b2{background:var(--pink)}.b3{background:var(--teal);color:#10201f}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.otp input{aspect-ratio:3/4;width:100%;text-align:center;font-size:1.5rem;font-weight:800;border:3px solid #060624;border-radius:12px;background:#fff;color:#060624}
.tl{list-style:none;padding:0;border-left:4px solid var(--ink);margin-left:10px}.tl li{padding:0 0 18px 18px;position:relative;color:var(--mute)}
.tl li:before{content:"";position:absolute;left:-12px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.tl li.d{color:var(--ink);font-weight:800}.tl li.d:before{background:var(--teal)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:700;z-index:9;display:none}
/* Pantalla 03 · Iniciar sesión */
body.lgn #app{max-width:none}
.lg{position:relative;min-height:100dvh;background:#fff;color:#0d1220;display:flex;justify-content:center;overflow:hidden}
.lg-in{position:relative;z-index:1;width:100%;max-width:26rem;padding:calc(clamp(28px,6vh,96px) + env(safe-area-inset-top,0px)) 24px calc(clamp(150px,18vw,200px) + 12px);display:flex;flex-direction:column;align-items:center}
.lg-logo{width:88px;height:auto;display:block}
.lg h1{font-size:clamp(2.1rem,8.5vw,2.7rem);margin:clamp(16px,3vh,26px) 0 clamp(24px,5vh,60px);text-align:center;color:#0d1220}
.lg-form{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.lg-f{display:flex;align-items:center;gap:12px;height:64px;padding:0 10px 0 18px;border:2px solid #cfd3da;border-radius:26px;background:#fff;transition:border-color .15s,box-shadow .15s}
.lg-f:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,16,35,.15)}
.lg-f.bad{border-color:var(--red)}
.lg-f svg{flex:none;width:26px;height:26px;stroke:#3a3f4a;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lg-f input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#0d1220;font-size:1.05rem;padding:0}
.lg-f input::placeholder{color:#5b6170}
.lg-eye{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer;padding:0}
.lg-eye:focus-visible{outline:3px solid var(--red)}
.lg .err{display:block;margin:6px 10px 0}
#e-g:not(:empty){margin:4px 0 0;padding:12px 16px;border:2px solid var(--red);border-radius:18px;background:#fdecee;text-align:center;font-size:.95rem}
.lg-forgot{justify-self:center;color:#4b5563;font-size:1.05rem;text-decoration:none;padding:8px 6px;margin-top:2px}
.lg-forgot:hover,.lg-forgot:focus-visible{color:var(--red);text-decoration:underline}
.lg .btn{min-height:64px;font-size:1.35rem;box-shadow:none;margin-top:10px}
.lg .btn:active{transform:scale(.98);box-shadow:none}
.lg .btn:disabled{opacity:.7;cursor:progress}
@media(max-height:800px){.lg-in{padding-top:24px}.lg-form{gap:14px}}
.lg-wave{position:absolute;left:0;bottom:0;width:100%;height:clamp(150px,18vw,200px);display:block;pointer-events:none}
/* Pantalla 04 · Crear cuenta */
.rg .lg-in{padding-top:calc(clamp(24px,6vh,90px) + env(safe-area-inset-top,0px))}
.rg-ico{width:62px;height:auto;display:block;stroke:var(--red);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rg h1{font-size:clamp(2.3rem,9.5vw,3rem);margin:clamp(14px,2.5vh,22px) 0 clamp(18px,3.5vh,34px)}
.rg .lg-form{gap:13px}
.rg .lg-f{height:52px;padding:0 10px 0 18px;border-radius:18px;border-color:#b9bcc6}
.rg .lg-f input{font-size:1.1rem}
.rg .lg-f input::placeholder{color:#4b5160}
.rg .lg .err,.rg .err{margin:4px 10px 0}
.rg .btn{min-height:58px;margin-top:12px}
/* Pantalla 05 · Verifica tu cuenta */
.vf .lg-logo{width:76px}
.vf h1{font-size:clamp(1.9rem,7.6vw,2.6rem);margin:clamp(16px,3vh,28px) 0 clamp(14px,2.5vh,24px)}
.vf-d{text-align:center;color:#4b4f58;font-size:clamp(1.02rem,4.6vw,1.2rem);line-height:1.5}
.vf-o{width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(7px,2.4vw,12px);margin-top:clamp(24px,6vh,56px)}
.vf-o input{width:100%;aspect-ratio:11/14;min-height:0;text-align:center;font-size:1.8rem;font-weight:800;border:2px solid #a9abb1;border-radius:18px;background:#fff;color:#0d1220;padding:0;outline:0;transition:border-color .15s,box-shadow .15s}
.vf-o input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,16,35,.15)}
.vf-o.bad input{border-color:var(--red)}
.vf .btn{margin-top:clamp(28px,7vh,64px)}
.vf .lg-in{padding-top:calc(clamp(32px,10vh,120px) + env(safe-area-inset-top,0px))}
.vf h1{margin-top:clamp(18px,3.5vh,36px)}
.vf .vf-o{margin-top:clamp(26px,8vh,84px)}
.vf .btn{margin-top:clamp(30px,10vh,110px)}
@media(min-width:1000px) and (max-height:800px){.vf .lg-in{padding-top:28px}.vf .btn{margin-top:40px}}
@media(max-height:700px){.vf .lg-in{padding-top:24px}.vf .vf-o{margin-top:24px}.vf .btn{margin-top:28px}}
.vf #e-o:not(:empty){margin:14px 0 -14px;padding:12px 16px;border:2px solid var(--red);border-radius:18px;background:#fdecee;text-align:center;font-size:.95rem}
/* Pantalla 06 · Recuperar contraseña */
.rc .lg-in{padding:calc(clamp(32px,10vh,120px) + env(safe-area-inset-top,0px)) 24px calc(clamp(150px,18vw,200px) + 12px)}
.rc .lg-logo{width:84px}
.rc h1{font-size:clamp(2.1rem,9vw,2.8rem);line-height:1.1;margin:clamp(16px,3vh,28px) 0 clamp(12px,2.5vh,22px)}
.rc-d{text-align:center;color:#4b4f58;font-size:clamp(1.05rem,4.9vw,1.3rem);line-height:1.5}
.rc .lg-form{margin-top:clamp(28px,8vh,80px)}
.rc .lg-f{padding-left:20px}
.rc .btn{margin-top:clamp(20px,7vh,80px)}
.rc #e-g:not(:empty){padding:12px 16px;border:2px solid var(--red);border-radius:18px;background:#fdecee;text-align:center;font-size:.95rem}
.rc #e-g.ok:not(:empty){border-color:var(--teal);background:#e6f6f5;color:#0b5f5c}
@media(min-width:1000px) and (max-height:800px){.rc .lg-in{padding-top:24px}.rc .lg-form{margin-top:28px}.rc .btn{margin-top:24px}}
@media(max-height:700px){.rc .lg-in{padding-top:20px}.rc .lg-form{margin-top:20px}.rc .btn{margin-top:20px}}
/* Pantalla 07 · Nueva contraseña */
.nc .lg-in{padding-top:calc(clamp(24px,6vh,100px) + env(safe-area-inset-top,0px))}
.nc .rc-d{font-weight:600;color:#5b6170}
.nc .lg-form{margin-top:clamp(22px,5vh,56px);gap:clamp(14px,3vh,26px)}
.nc .lg-f{height:58px}
.nc .btn{margin-top:clamp(18px,5vh,52px)}
@media(min-width:1000px) and (max-height:800px){.nc .lg-in{padding-top:20px;padding-bottom:120px}.nc .lg-logo{width:64px}.nc h1{margin:12px 0 10px;font-size:2.2rem}.nc .lg-form{margin-top:14px;gap:12px}.nc .btn{margin-top:14px}}
@media(max-height:700px){.nc .lg-in{padding-top:20px}.nc .lg-form{margin-top:18px;gap:12px}.nc .btn{margin-top:16px}}
/* Pantalla 08 · Completar perfil */
.pf .lg-in{padding-top:calc(clamp(28px,7vh,84px) + env(safe-area-inset-top,0px))}
.pf .rg-ico{width:clamp(52px,14vw,64px);stroke-width:4}
.pf #e-g:empty,.pf #e-ft:empty{display:none}
.pf h1{font-size:clamp(1.75rem,7.6vw,2.4rem);margin:clamp(14px,2.4vh,24px) 0 clamp(18px,3.4vh,36px);white-space:nowrap}
.pf-av{position:relative;width:clamp(116px,34vw,144px);aspect-ratio:1/1;flex:none}
.pf-ph{width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid #aeaeb3;background:#f3f3f4}
.pf-ph svg,.pf-ph img{width:100%;height:100%;display:block;object-fit:cover}
.pf-ph svg{stroke:none}
.pf-add{position:absolute;right:-3%;bottom:-3%;width:35%;min-width:44px;aspect-ratio:1/1;border-radius:50%;border:0;background:var(--red);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 0 0 3px #fff}
.pf-add svg{width:52%;height:52%;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round}
.pf-add:focus-visible{outline:3px solid #0d1220;outline-offset:3px}
.pf-add:active{background:var(--red2)}
.pf-ft{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pf-rm{margin-top:6px;border:0;background:none;color:#4b5563;font-size:.95rem;text-decoration:underline;cursor:pointer;padding:6px 10px;min-height:44px}
.pf-rm[hidden]{display:none}
.pf #e-ft:not(:empty){margin-top:10px;text-align:center}
.pf .lg-form{margin-top:clamp(18px,4.5vh,44px);gap:clamp(14px,2.6vh,22px)}
.pf .lg-f{position:relative;height:58px;border-radius:20px;border-color:#d3d5db}
.pf .lg-f input{font-size:1.15rem;color:#0d1220}
.pf .lg-f input::placeholder{color:#2b3347;opacity:1}
.pf .lg-f svg{stroke:#0d1220}
.pf-dt{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;border:0;padding:0}
.pf .btn{min-height:62px;margin-top:clamp(8px,2.6vh,26px)}
.pf #e-g.ok:not(:empty){border-color:var(--teal);background:#e6f6f5;color:#0b5f5c}
@media(max-height:700px){.pf .lg-in{padding-top:18px}.pf h1{margin:10px 0 14px}.pf .lg-form{margin-top:12px;gap:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>

prep=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const m=Math.min(im.naturalWidth,im.naturalHeight),z=Math.min(512,m),c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,z,z);x.drawImage(im,(im.naturalWidth-m)/2,(im.naturalHeight-m)/2,m,m,0,0,z,z);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.85)}catch(e){URL.revokeObjectURL(u);no(e)}};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u}),
okDate=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const[y,m,d]=v.split('-').map(Number),x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d};
nv.value=P.n||'';fn.value=P.d||'';fv.value=fmt(P.d||'');showPh();
nv.oninput=()=>{P.n=nv.value;$('#e-nv').textContent='';$('#w-nv').classList.remove('bad');g.textContent=''};
fn.onclick=()=>{try{fn.showPicker&&fn.showPicker()}catch(e){}};
fn.onchange=fn.oninput=()=>{P.d=fn.value;fv.value=fmt(fn.value);$('#e-fn').textContent='';$('#w-fn').classList.remove('bad');g.textContent=''};
$('#add').onclick=()=>{$('#e-ft').textContent='';ft.value='';ft.click()};
rm.onclick=()=>{if(P.url)URL.revokeObjectURL(P.url);P.url=P.blob=null;showPh();$('#e-ft').textContent=''};
ft.onchange=async()=>{const f=ft.files&&ft.files[0],e=$('#e-ft');e.textContent='';if(!f)return;
if(!/^image\/(jpeg|png|webp)$/.test(f.type))return bad('ft','Elige una imagen JPG, PNG o WEBP');
if(f.size>10*1048576)return bad('ft','La imagen pesa más de 10 MB. Elige una más liviana');
try{const b=await prep(f);if(P.url)URL.revokeObjectURL(P.url);P.blob=b;P.url=URL.createObjectURL(b);showPh()}catch(x){bad('ft','No pudimos leer esa imagen. Prueba con otra foto')}};
$('#f').onsubmit=async ev=>{ev.preventDefault();['nv','fn'].forEach(k=>{$('#e-'+k).textContent='';$('#w-'+k).classList.remove('bad')});g.textContent='';g.className='err c';
const n=nv.value.trim().replace(/\s+/g,' '),d=fn.value;let e=0;
const mn=!n?'Ingresa tu nombre visible':n.length<2?'Escribe al menos 2 caracteres':!/^[\p{L}\p{N}][\p{L}\p{N}\s'._-]*$/u.test(n)&&'Usa solo letras, números y espacios';
let md=false;if(!d)md='Selecciona tu fecha de nacimiento';else if(!okDate(d))md='La fecha de nacimiento no es válida';else if(d>hoy)md='La fecha de nacimiento no puede ser futura';else if(+d.slice(0,4)<1900)md='Revisa el año de tu fecha de nacimiento';
if(mn){bad('nv',mn);$('#w-nv').classList.add('bad');e=1}if(md){bad('fn',md);$('#w-fn').classList.add('bad');e=1}if(e)return;
go.disabled=true;go.textContent='Guardando…';
try{const r=await Profile.save({name:n,birth:d,blob:P.blob});S.profile=r;S.user.n=n.split(' ')[0];if(r&&r.avatar_url)S.user.avatar=r.avatar_url;
if(R['seleccionar-ubicacion']){location.hash='seleccionar-ubicacion';return}
g.className='err c ok';g.textContent='Perfil guardado correctamente. La pantalla 09 (Seleccionar ubicación) aún no está desarrollada.'}
catch(x){g.textContent=x.message}finally{go.disabled=false;go.textContent='Continuar'}}},
inicio(){shell('inicio',`<div class="gap"><div class="row"><b style="font-size:1.35rem">Perú<span style="color:var(--red)">Vive</span></b><a href="#notif" aria-label="Notificaciones" style="font-size:1.4rem;text-decoration:none">🔔</a></div><h1>¡Hola, ${esc(S.user.n)}!</h1><p class="mute">Juntos somos más fuertes. ¿Qué necesitas hoy?</p>
<a href="#reportar" class="act" style="background:var(--red);flex-direction:row;align-items:center;gap:14px;min-height:0;box-shadow:0 7px 0 var(--red2)"><span>🚨</span><div style="font-size:1.4rem;line-height:1.1">Reportar emergencia<small>Avisa ahora a tu comunidad</small></div></a>
<div class="grid2"><a href="#solicitar" class="act" style="background:var(--gold);color:#1c1210"><span>🙋</span><div>Solicitar ayuda<small>Pide apoyo a tu comunidad</small></div></a><a href="#ofrecer" class="act" style="background:var(--teal);color:#10201f"><span>🤲</span><div>Ofrecer ayuda<small>Ayuda a quien lo necesita</small></div></a><a href="#mapa" class="act" style="background:var(--pink)"><span>📍</span><div>Mapa solidario<small>Recursos cerca de ti</small></div></a><a href="#seguimiento" class="act" style="background:var(--pur)"><span>👥</span><div>Comunidad<small>Seguimiento y voluntarios</small></div></a></div>
<div class="card" style="--a:var(--gold)"><h2>Números de emergencia</h2><div class="grid2" style="margin-top:10px;gap:8px">${[['105','Policía'],['106','SAMU'],['115','INDECI'],['116','Bomberos']].map(([n,l])=>`<a href="tel:${n}" style="text-decoration:none;color:inherit;font-weight:700"><b style="color:var(--red);font-size:1.2rem">${n}</b> ${l}</a>`).join('')}</div></div></div>`)},
reportar(){if(!R.keep)S.draft={};R.keep=0;shell('reportar',`<div class="gap">${hd('Reportar emergencia','location.hash=\'inicio\'')}<h2>Tipo de emergencia</h2><div id="o">${opts(TIPOS,'tipo')}</div><button class="btn" id="go">Continuar</button><p class="c mute" style="font-size:.85rem">Si hay peligro de vida, llama primero al 105, 106, 115 o 116.</p></div>`);
$('#go').onclick=()=>S.draft.tipo?location.hash='r-desc':toast('Elige un tipo de emergencia')},
'r-desc'(){shell('reportar',`<div class="gap">${hd('Describe la emergencia')}<label class="field">Cuéntanos qué está pasando<textarea id="d" style="color:var(--ink);background:var(--card)"></textarea></label><button class="btn" id="go">Continuar</button></div>`);$('#d').value=S.draft.desc||'';$('#go').onclick=()=>{S.draft.desc=$('#d').value.trim();location.hash='r-ubi'}},
'r-ubi'(){shell('reportar',`<div class="gap">${hd('Ubicación de la emergencia')}${mapa([[50,48,'📍']],'height:260px')}<div class="card" style="--a:var(--teal)">📍 Chaclacayo, Lima</div><button class="btn" id="go">Confirmar ubicación</button></div>`);
$('#go').onclick=()=>{S.items.unshift({id:nid++,kind:'Emergencia',tipo:S.draft.tipo,desc:S.draft.desc||'Sin descripción',est:0,mine:true,hora:'Ahora'});location.hash='r-ok'}},
'r-ok'(){shell('reportar',`<div class="c gap" style="padding-top:60px"><div style="font-size:4rem">✅</div><h1>¡Reporte enviado!</h1><p class="mute">Tu emergencia ha sido registrada y será atendida por la comunidad y coordinación.</p><a class="btn" href="#inicio">Volver al inicio</a><a class="btn ghost" href="#seguimiento">Ver seguimiento</a></div>`)},
solicitar(){form('Solicitar ayuda','Solicitud',CATS.slice(0,5).concat([CATS[6]]),'gold','Describe lo que necesitas','Enviar solicitud')},
ofrecer(){form('Ofrecer ayuda','Oferta',CATS.filter(c=>['Alimentos','Agua','Transporte','Voluntariado','Otro'].includes(c[0])),'teal','Describe tu aporte','Publicar ayuda')},
mapa(){shell('mapa',`<div class="gap">${hd('Mapa solidario','location.hash=\'inicio\'')}${mapa([[28,30,'🚨'],[66,40,'🙋'],[45,68,'🤲'],[78,72,'🍲'],...S.items.filter(i=>i.mine).map((i,k)=>[30+k*12,55,'📍'])],'height:380px')}<p class="mute c">🚨 Emergencias · 🙋 Solicitudes · 🤲 Ofertas · 🍲 Olla común</p></div>`)},
seguimiento(){shell('seguimiento',`<div class="gap">${hd('Seguimiento','location.hash=\'inicio\'')}${S.items.map(i=>`<a href="#detalle" onclick="S.sel=${i.id}" style="text-decoration:none;color:inherit;display:block" class="card"><div class="row"><b>${esc(i.tipo)}</b><span class="badge ${BC[i.est]}">${ESTADOS[i.est]}</span></div><div class="mute" style="font-size:.9rem">${i.kind} · ${i.hora}${i.mine?' · Tuyo':''}</div></a>`).join('')}</div>`)},
detalle(){const i=S.items.find(x=>x.id===S.sel)||S.items[0];shell('seguimiento',`<div class="gap">${hd('Seguimiento de solicitud')}<div class="card"><h2>${esc(i.tipo)}</h2><p class="mute">${esc(i.desc)}</p></div><ul class="tl">${ESTADOS.map((e,k)=>`<li class="${k<=i.est?'d':''}">${e}</li>`).join('')}</ul></div>`)},
notif(){shell('inicio',`<div class="gap">${hd('Notificaciones')}${['Tu reporte está en atención · Hace 5 min','Nueva ayuda disponible cerca · Hace 30 min','Tu solicitud fue validada · Hace 1 h'].map(t=>`<div class="card" style="--a:var(--pink)">${t}</div>`).join('')}</div>`)},
perfil(){const u=S.user;shell('perfil',`<div class="gap c"><div style="width:90px;height:90px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);display:grid;place-items:center;font-size:2.6rem;font-weight:800;margin:10px auto 0;color:#1c1210">${esc(u.n[0].toUpperCase())}</div><h1>${esc(u.full||u.n)}</h1><p class="mute">Ciudadano · Chaclacayo, Lima</p><a class="btn gold" href="#coord">Centro de coordinación</a><a class="btn teal" href="#ayuda">Centro de ayuda</a><button class="btn ghost" id="out">Cerrar sesión</button></div>`);$('#out').onclick=()=>{S.user=null;location.hash='acceso'}},
ayuda(){shell('perfil',`<div class="gap">${hd('Centro de ayuda')}${[['105','Policía Nacional (PNP)'],['106','SAMU · emergencias médicas'],['115','INDECI · Defensa Civil'],['116','Bomberos']].map(([n,l])=>`<a class="card" href="tel:${n}" style="display:block;text-decoration:none;color:inherit;--a:var(--gold)"><b style="color:var(--red);font-size:1.4rem">${n}</b> ${l}</a>`).join('')}<p class="mute">Perú Vive complementa, no reemplaza, a los servicios oficiales.</p></div>`)},
coord(){const em=S.items.filter(i=>i.kind==='Emergencia'),so=S.items.filter(i=>i.kind==='Solicitud').length;shell('perfil',`<div class="gap">${hd('Coordinación')}<div class="grid2"><div class="card"><b style="font-size:2rem">${em.length}</b><br>Emergencias</div><div class="card" style="--a:var(--gold)"><b style="font-size:2rem">${so}</b><br>Solicitudes</div></div><div class="card" style="--a:var(--teal)"><b style="font-size:2rem">45</b> voluntarios activos</div><h2>Gestión de emergencias</h2>${em.map(i=>`<div class="card"><div class="row"><b>${esc(i.tipo)}</b><span class="badge ${BC[i.est]}">${ESTADOS[i.est]}</span></div><p class="mute" style="font-size:.9rem">${esc(i.desc)}</p>${i.est<3?`<button class="btn gold" style="min-height:44px;margin-top:10px" onclick="S.items.find(x=>x.id==${i.id}).est++;R.coord();toast('Estado actualizado')">Avanzar a «${ESTADOS[i.est+1]}»</button>`:''}</div>`).join('')}</div>`)}};
function form(t,kind,list,col,ph,cta){if(!R.keep)S.draft={};R.keep=0;shell('inicio',`<div class="gap">${hd(t)}<div id="o">${opts(list,'cat')}</div><label class="field">${ph}<textarea id="d" style="color:var(--ink);background:var(--card)"></textarea></label><button class="btn ${col}" id="go">${cta}</button></div>`);
$('#go').onclick=()=>{if(!S.draft.cat)return toast('Elige una categoría');S.items.unshift({id:nid++,kind,tipo:kind+': '+S.draft.cat,desc:$('#d').value.trim()||'Sin descripción',est:0,mine:true,hora:'Ahora'});toast(kind==='Oferta'?'¡Gracias por ofrecer ayuda!':'Solicitud enviada');location.hash='seguimiento'}}
function mapa(p,s){return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Mapa de Chaclacayo" style="width:100%;${s};border:3px solid var(--ink);border-radius:24px;background:#e9efe1;display:block"><path d="M0 62 Q30 48 55 58 T100 50 V100 H0Z" fill="#cfe3c4"/><path d="M0 20 L100 35 M20 0 L40 100 M70 0 L60 100" stroke="#fff" stroke-width="3" fill="none"/><path d="M0 80 Q40 70 100 85" stroke="#9fd0e8" stroke-width="4" fill="none"/>${p.map(([x,y,e])=>`<text x="${x}" y="${y}" font-size="9" text-anchor="middle">${e}</text>`).join('')}</svg>`}
const PRIV=['completar-perfil','inicio','mapa','reportar','r-desc','r-ubi','r-ok','solicitar','ofrecer','seguimiento','detalle','notif','perfil','ayuda','coord'];
function route(){const h=location.hash.slice(1)||'splash';document.body.classList.toggle('lgn',['login','registro','verificar','recuperar','nueva-contrasena','completar-perfil'].includes(h));if(PRIV.includes(h)&&!S.user)return location.hash='acceso';(R[h]||R.splash)()}
addEventListener('hashchange',route);route();
</script></body></html>
